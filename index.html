<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>लक्ष्य 22 | Lakshya 22 - ट्रेडिंग सिम्युलेटर</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #020617; --card: #1e293b; --gold: #fbbf24; --green: #10b981; --red: #ef4444; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; text-align: center; }
        .header { color: var(--gold); font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 1000px; margin: 0 auto 20px auto; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .val { font-size: 1.2rem; font-weight: bold; color: var(--gold); }
        .chart-container { background: #0f172a; padding: 20px; border-radius: 15px; max-width: 1000px; margin: 0 auto 20px auto; height: 300px; }
        .market { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 800px; margin: 0 auto; }
        .stock { background: #1e293b; padding: 15px; border-radius: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        #logs { background: #000; padding: 10px; height: 80px; overflow-y: auto; margin-top: 20px; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>

    <h1 class="header">📈 लक्ष्य 22 [LAKSHYA 22] 👑</h1>

    <div class="grid-stats">
        <div class="card">नकद<div id="c" class="val">₹22,00,000</div></div>
        <div class="card">लोन<div id="l" class="val">₹0</div></div>
        <div class="card">टैक्स<div id="t" class="val">₹0</div></div>
        <div class="card">नेटवर्थ<div id="n" class="val">₹22,00,000</div></div>
    </div>

    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>

    <button class="btn" style="background:var(--gold)" onclick="takeLoan()">₹5 लाख का लोन लें</button>

    <div class="market" id="market"></div>
    <div id="logs">[सिस्टम]: लक्ष्य 22 एक्टिव! ट्रेडिंग शुरू करें।</div>

    <script>
        let cash = 2200000, loan = 0, totalTax = 0;
        const stock = { name: 'लक्ष्य इंडेक्स', price: 1000, buyPrice: 0, owned: 0 };
        const priceHistory = [];
        
        const ctx = document.getElementById('priceChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'इंडेक्स प्राइस', data: [], borderColor: '#fbbf24', fill: false }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        function takeLoan() {
            if (loan > 0) return alert("पहले पुराना लोन चुकाएं!");
            loan = 500000; cash += 500000; update();
        }

        function trade(type) {
            if (type === 'B' && cash >= stock.price) {
                cash -= stock.price; stock.owned++; stock.buyPrice = stock.price;
            } else if (type === 'S' && stock.owned > 0) {
                let profit = stock.price - stock.buyPrice;
                if (profit > 0) { let tax = profit * 0.05; totalTax += tax; cash -= tax; }
                cash += stock.price; stock.owned--;
            }
            update();
        }

        function update() {
            document.getElementById('c').innerText = `₹${Math.floor(cash)}`;
            document.getElementById('l').innerText = `₹${loan}`;
            document.getElementById('t').innerText = `₹${Math.floor(totalTax)}`;
            document.getElementById('n').innerText = `₹${Math.floor(cash - loan)}`;
        }

        setInterval(() => {
            stock.price += (Math.random() - 0.5) * 50;
            priceHistory.push(Math.floor(stock.price));
            if(priceHistory.length > 20) priceHistory.shift();
            
            chart.data.labels = priceHistory.map((_, i) => i);
            chart.data.datasets[0].data = priceHistory;
            chart.update();

            if (loan > 0) {
                cash -= 50000; loan -= 50000;
                document.getElementById('logs').innerHTML += "<br>✅ EMI कटी: ₹50,000";
            }
            update();
        }, 5000);

        document.getElementById('market').innerHTML = `<div class="stock"><h3>${stock.name}</h3><p class="val" id="p">₹1000</p><button class="btn" style="background:var(--green)" onclick="trade('B')">BUY</button><button class="btn" style="background:var(--red)" onclick="trade('S')">SELL</button></div>`;
    </script>
</body>
</html>
